<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Construction Sketch — Shared Drawing</title><link rel="stylesheet" href="viewer.css"></head><body>
<header><strong>Construction Sketch</strong></header><main>
<section id="drawing-header" hidden><div><h1 id="name"></h1><p id="owner"></p></div><button id="download" hidden>Download Drawing</button></section>

<footer>Construction Sketch</footer><script type="module" src="viewer.js"></script></body></html>
